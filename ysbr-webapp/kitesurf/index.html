<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Titolo e descrizione arrivano da it.json (meta.kitesurf), vedi vite-seo.js -->
    <title>%SEO_TITLE%</title>
    <meta name="description" content="%SEO_DESCRIPTION%" />
    <link rel="canonical" href="https://www.ysbr.it/kitesurf/" />
    <meta name="theme-color" content="#000000" />

    <!-- Anteprima quando il link viene condiviso (WhatsApp, Instagram, Facebook...) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="YSBR" />
    <meta property="og:url" content="https://www.ysbr.it/kitesurf/" />
    <meta property="og:title" content="%SEO_TITLE%" />
    <meta property="og:description" content="%SEO_DESCRIPTION%" />
    <meta property="og:image" content="https://www.ysbr.it/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/kitesurf-main.jsx"></script>
  </body>
</html>
